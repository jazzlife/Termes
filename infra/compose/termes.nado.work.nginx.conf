# Managed by the Termes deployment. Cloudflare Tunnel terminates public TLS and
# forwards termes.nado.work to Nginx Proxy Manager over the shared npm_bridge.
server {
  listen 80;
  listen [::]:80;
  server_name termes.nado.work;

  set $forward_scheme http;
  set $server termes-web;
  set $port 80;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;

  access_log /data/logs/termes_access.log proxy;
  error_log /data/logs/termes_error.log warn;

  # Connector transport requires a real HTTP/1.1 WebSocket upgrade through
  # both Nginx layers. Do not forward the client Connection header verbatim.
  location = /api/desktop-connectors/connect {
    proxy_pass http://termes-web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
  }

  location / {
    include conf.d/include/proxy.conf;
  }
}
