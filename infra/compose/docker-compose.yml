name: termes

services:
  postgres:
    image: postgres:16-alpine
    container_name: termes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /data/docker_data/termes/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - termes_internal

  redis:
    image: redis:7-alpine
    container_name: termes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /data/docker_data/termes/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - termes_internal

  minio:
    image: minio/minio:latest
    container_name: termes-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /data/docker_data/termes/volumes/minio:/data
    networks:
      - termes_internal

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: termes-migrate
    restart: "no"
    command: ["node", "dist/migrate.cjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MIGRATIONS_DIR: /app/infra/db/migrations
      HERMES_MANAGER_URL: http://hermes-manager:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - termes_internal

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: termes-api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      HERMES_MANAGER_URL: http://hermes-manager:8080
      MIGRATIONS_DIR: /app/infra/db/migrations
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://100.64.0.9:4180}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET_ENC: ${GITHUB_CLIENT_SECRET_ENC:-}
      GITHUB_SECRET_KEY_FILE: ${GITHUB_SECRET_KEY_FILE:-/data/docker_data/termes/secrets/github-oauth.key}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_LOGIN: ${GITHUB_LOGIN:-}
      GITHUB_SECRETS_ROOT: /data/docker_data/termes/secrets
    ports:
      - "${TERMES_API_BIND}:${TERMES_API_PORT}:8080"
    volumes:
      - /data/docker_data/termes/workspaces:/data/docker_data/termes/workspaces
      - /data/docker_data/termes/secrets:/data/docker_data/termes/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal
      - npm_proxy

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    container_name: termes-orchestrator
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      HERMES_MANAGER_URL: http://hermes-manager:8080
      HERMES_RUN_TIMEOUT_MS: ${HERMES_RUN_TIMEOUT_MS:-120000}
    depends_on:
      api:
        condition: service_healthy
      hermes-manager:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal

  hermes-manager:
    build:
      context: ../..
      dockerfile: services/hermes-manager/Dockerfile
    container_name: termes-hermes-manager
    restart: unless-stopped
    environment:
      PORT: 8080
      HERMES_PROFILES_ROOT: /data/docker_data/termes/hermes/profiles
      CODEX_HOMES_ROOT: /data/docker_data/termes/hermes/codex-homes
      HERMES_RUNS_ROOT: /data/docker_data/termes/hermes/runs
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_OFFICIAL_AGENT_URL: ${HERMES_OFFICIAL_AGENT_URL:-}
      HERMES_AGENT_STATE_ROOT: /data/docker_data/termes/hermes-agent
      OPENAI_API_KEY_CONFIGURED: ${OPENAI_API_KEY:+true}
      OPENROUTER_API_KEY_CONFIGURED: ${OPENROUTER_API_KEY:+true}
      ANTHROPIC_API_KEY_CONFIGURED: ${ANTHROPIC_API_KEY:+true}
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}
      RUNNER_SUPERVISOR_URL: http://runner-supervisor:8080
    volumes:
      - /data/docker_data/termes/hermes:/data/docker_data/termes/hermes
      - /data/docker_data/termes/hermes-agent:/data/docker_data/termes/hermes-agent:ro
    depends_on:
      runner-supervisor:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal

  hermes-agent:
    build:
      context: ../..
      dockerfile: infra/hermes-agent/Dockerfile
    container_name: termes-hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    profiles:
      - hermes-upstream
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_AGENT_API_KEY:-}
      GATEWAY_ALLOW_ALL_USERS: ${HERMES_AGENT_GATEWAY_ALLOW_ALL_USERS:-true}
      HOME: /opt/data
      CODEX_HOME: /opt/data/.codex
      HERMES_HOME: /opt/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - /data/docker_data/termes/hermes-agent:/opt/data
      - /data/docker_data/termes/workspaces:/workspace
      - /data/docker_data/termes/runs:/data/docker_data/termes/runs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - termes_internal

  runner-supervisor:
    build:
      context: ../..
      dockerfile: services/runner-supervisor/Dockerfile
    container_name: termes-runner-supervisor
    restart: unless-stopped
    environment:
      PORT: 8080
      WORKSPACE_ROOT: /data/docker_data/termes/workspaces
      RUNS_ROOT: /data/docker_data/termes/runs
    volumes:
      - /data/docker_data/termes/workspaces:/data/docker_data/termes/workspaces
      - /data/docker_data/termes/runs:/data/docker_data/termes/runs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: termes-web
    restart: unless-stopped
    ports:
      - "${TERMES_WEB_BIND}:${TERMES_WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal
      - npm_proxy

  backup:
    image: alpine:3.22
    container_name: termes-backup
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /data/docker_data/termes/backups && sleep infinity"]
    volumes:
      - /data/docker_data/termes/backups:/data/docker_data/termes/backups
    networks:
      - termes_internal

  log-collector:
    image: alpine:3.22
    container_name: termes-log-collector
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /data/docker_data/termes/logs && sleep infinity"]
    volumes:
      - /data/docker_data/termes/logs:/data/docker_data/termes/logs
    networks:
      - termes_internal

networks:
  termes_internal:
    name: termes_internal
  npm_proxy:
    external: true
    name: ${TERMES_NPM_NETWORK}
