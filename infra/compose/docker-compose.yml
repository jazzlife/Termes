name: termes

services:
  postgres:
    image: postgres:16-alpine
    container_name: termes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /data/docker_data/termes/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - termes_internal

  redis:
    image: redis:7-alpine
    container_name: termes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /data/docker_data/termes/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - termes_internal

  minio:
    image: minio/minio:latest
    container_name: termes-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /data/docker_data/termes/volumes/minio:/data
    networks:
      - termes_internal

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: termes-migrate
    restart: "no"
    command: ["node", "dist/migrate.cjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MIGRATIONS_DIR: /app/infra/db/migrations
      HERMES_MANAGER_URL: http://hermes-manager:8080
      HERMES_MANAGER_SERVICE_TOKEN: ${HERMES_MANAGER_SERVICE_TOKEN:?HERMES_MANAGER_SERVICE_TOKEN is required}
      TERMES_SINGLE_ACCOUNT_ID: ${TERMES_SINGLE_ACCOUNT_ID:?TERMES_SINGLE_ACCOUNT_ID is required}
      TERMES_SINGLE_WORKSPACE_ID: ${TERMES_SINGLE_WORKSPACE_ID:?TERMES_SINGLE_WORKSPACE_ID is required}
      TERMES_SINGLE_RUNTIME_CELL_ID: ${TERMES_SINGLE_RUNTIME_CELL_ID:?TERMES_SINGLE_RUNTIME_CELL_ID is required}
      TERMES_OAUTH_ADMIN_ACCOUNT_ID: ${TERMES_OAUTH_ADMIN_ACCOUNT_ID:?TERMES_OAUTH_ADMIN_ACCOUNT_ID is required}
      TERMES_ACCOUNT_ACCESS_HASHES_JSON: ${TERMES_ACCOUNT_ACCESS_HASHES_JSON:?TERMES_ACCOUNT_ACCESS_HASHES_JSON is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - termes_internal

  device-gateway:
    build:
      context: ../..
      dockerfile: services/device-gateway/Dockerfile
    container_name: termes-device-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      DEVICE_GATEWAY_ROOT: /data/docker_data/termes/device-gateway
      DEVICE_COMMAND_TIMEOUT_MS: ${DEVICE_COMMAND_TIMEOUT_MS:-30000}
      DEVICE_ALLOWED_HOSTS: ${DEVICE_ALLOWED_HOSTS:-}
      WINRM_ALLOWED_HOSTS: ${WINRM_ALLOWED_HOSTS:-}
    volumes:
      - /data/docker_data/termes/device-gateway:/data/docker_data/termes/device-gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: termes-api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      HERMES_MANAGER_URL: http://hermes-manager:8080
      HERMES_MANAGER_SERVICE_TOKEN: ${HERMES_MANAGER_SERVICE_TOKEN:?HERMES_MANAGER_SERVICE_TOKEN is required}
      DEVICE_GATEWAY_URL: http://device-gateway:8080
      TERMES_SINGLE_ACCOUNT_ID: ${TERMES_SINGLE_ACCOUNT_ID:?TERMES_SINGLE_ACCOUNT_ID is required}
      TERMES_SINGLE_WORKSPACE_ID: ${TERMES_SINGLE_WORKSPACE_ID:?TERMES_SINGLE_WORKSPACE_ID is required}
      TERMES_SINGLE_RUNTIME_CELL_ID: ${TERMES_SINGLE_RUNTIME_CELL_ID:?TERMES_SINGLE_RUNTIME_CELL_ID is required}
      TERMES_OAUTH_ADMIN_ACCOUNT_ID: ${TERMES_OAUTH_ADMIN_ACCOUNT_ID:?TERMES_OAUTH_ADMIN_ACCOUNT_ID is required}
      TERMES_ACCOUNT_ACCESS_HASHES_JSON: ${TERMES_ACCOUNT_ACCESS_HASHES_JSON:?TERMES_ACCOUNT_ACCESS_HASHES_JSON is required}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-300000}
      MIGRATIONS_DIR: /app/infra/db/migrations
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://100.64.0.9:4180}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_BROWSER_OAUTH_ENABLED: ${GITHUB_BROWSER_OAUTH_ENABLED:-true}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-http://100.64.0.9:4180/api/github/oauth/callback}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-repo read:org}
      GITHUB_CLIENT_SECRET_ENC: ${GITHUB_CLIENT_SECRET_ENC:-}
      GITHUB_SECRET_KEY_FILE: ${GITHUB_SECRET_KEY_FILE:-/data/docker_data/termes/secrets/github-oauth.key}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_LOGIN: ${GITHUB_LOGIN:-}
      GITHUB_SECRETS_ROOT: /data/docker_data/termes/secrets
    ports:
      - "${TERMES_API_BIND}:${TERMES_API_PORT}:8080"
    volumes:
      - ${TERMES_WORKSPACES_HOST_ROOT:?TERMES_WORKSPACES_HOST_ROOT is required}:/data/docker_data/termes/workspaces/users
      - /data/docker_data/termes/secrets:/data/docker_data/termes/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      device-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal
      - npm_proxy

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    container_name: termes-orchestrator
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://api:8080
      HERMES_MANAGER_URL: http://hermes-manager:8080
      HERMES_MANAGER_SERVICE_TOKEN: ${HERMES_MANAGER_SERVICE_TOKEN:?HERMES_MANAGER_SERVICE_TOKEN is required}
      HERMES_RUN_TIMEOUT_MS: ${HERMES_RUN_TIMEOUT_MS:-900000}
      TERMES_SINGLE_ACCOUNT_ID: ${TERMES_SINGLE_ACCOUNT_ID:?TERMES_SINGLE_ACCOUNT_ID is required}
      TERMES_SINGLE_WORKSPACE_ID: ${TERMES_SINGLE_WORKSPACE_ID:?TERMES_SINGLE_WORKSPACE_ID is required}
      TERMES_SINGLE_RUNTIME_CELL_ID: ${TERMES_SINGLE_RUNTIME_CELL_ID:?TERMES_SINGLE_RUNTIME_CELL_ID is required}
    depends_on:
      api:
        condition: service_healthy
      hermes-manager:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal

  hermes-projector:
    build:
      context: ../..
      dockerfile: services/hermes-projector/Dockerfile
    container_name: termes-hermes-projector
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal

  hermes-manager:
    build:
      context: ../..
      dockerfile: services/hermes-manager/Dockerfile
    container_name: termes-hermes-manager
    restart: unless-stopped
    environment:
      PORT: 8080
      HERMES_PROFILES_ROOT: /data/docker_data/termes/hermes/profiles
      CODEX_HOMES_ROOT: /data/docker_data/termes/hermes/codex-homes
      CODEX_HOME: /data/docker_data/termes/hermes-agent/.codex
      HERMES_RUNS_ROOT: /data/docker_data/termes/hermes/runs
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_OFFICIAL_AGENT_URL: ${HERMES_OFFICIAL_AGENT_URL:-}
      HERMES_DASHBOARD_BASE_URL: http://hermes-dashboard:9119
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?HERMES_DASHBOARD_SESSION_TOKEN is required}
      HERMES_MANAGER_SERVICE_TOKEN: ${HERMES_MANAGER_SERVICE_TOKEN:?HERMES_MANAGER_SERVICE_TOKEN is required}
      HERMES_CELL_AUTHORITY_TOKEN: ${HERMES_CELL_AUTHORITY_TOKEN:?HERMES_CELL_AUTHORITY_TOKEN is required}
      HERMES_MANAGER_GATEWAY_BASE_URL: ws://hermes-manager:8080
      TERMES_SINGLE_ACCOUNT_ID: ${TERMES_SINGLE_ACCOUNT_ID:?TERMES_SINGLE_ACCOUNT_ID is required}
      TERMES_SINGLE_WORKSPACE_ID: ${TERMES_SINGLE_WORKSPACE_ID:?TERMES_SINGLE_WORKSPACE_ID is required}
      TERMES_SINGLE_RUNTIME_CELL_ID: ${TERMES_SINGLE_RUNTIME_CELL_ID:?TERMES_SINGLE_RUNTIME_CELL_ID is required}
      HERMES_ACCOUNT_CELLS_JSON: >-
        [{"accountId":"${TERMES_SINGLE_ACCOUNT_ID}","workspaceId":"${TERMES_SINGLE_WORKSPACE_ID}","runtimeCellId":"${TERMES_SINGLE_RUNTIME_CELL_ID}","dashboardBaseUrl":"http://hermes-dashboard:9119"},{"accountId":"${TERMES_SECOND_ACCOUNT_ID}","workspaceId":"${TERMES_SECOND_WORKSPACE_ID}","runtimeCellId":"${TERMES_SECOND_RUNTIME_CELL_ID}","dashboardBaseUrl":"http://hermes-dashboard-account-b:9119"}]
      HERMES_AGENT_STATE_ROOT: /data/docker_data/termes/hermes-agent
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}
      RUNNER_SUPERVISOR_URL: http://runner-supervisor:8080
    volumes:
      - /data/docker_data/termes/hermes:/data/docker_data/termes/hermes
      - /data/docker_data/termes/hermes-agent:/data/docker_data/termes/hermes-agent:ro
      - /data/docker_data/termes/hermes-agent/.codex:/data/docker_data/termes/hermes-agent/.codex
    depends_on:
      runner-supervisor:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal
      - termes_cell_default
      - termes_cell_b

  hermes-agent:
    build:
      context: ../..
      dockerfile: infra/hermes-agent/Dockerfile
    container_name: termes-hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    profiles:
      - hermes-upstream
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_AGENT_API_KEY:?HERMES_AGENT_API_KEY is required}
      GATEWAY_ALLOW_ALL_USERS: ${HERMES_AGENT_GATEWAY_ALLOW_ALL_USERS:-true}
      HOME: /opt/data
      CODEX_HOME: /opt/data/.codex
      HERMES_HOME: /opt/data
      HERMES_CODEX_APP_SERVER_INIT_TIMEOUT_SECONDS: ${HERMES_CODEX_APP_SERVER_INIT_TIMEOUT_SECONDS:-45}
      TERMES_CODEX_AUTHORITY_URL: http://hermes-manager:8080/internal/openai-auth/external-tokens
      TERMES_CODEX_AUTHORITY_TOKEN: ${HERMES_CELL_AUTHORITY_TOKEN:?HERMES_CELL_AUTHORITY_TOKEN is required}
    volumes:
      - ${TERMES_ACCOUNT_HERMES_HOST_ROOT:?TERMES_ACCOUNT_HERMES_HOST_ROOT is required}:/opt/data
      - ${TERMES_ACCOUNT_WORKSPACE_HOST_ROOT:?TERMES_ACCOUNT_WORKSPACE_HOST_ROOT is required}:/workspace
      - ${TERMES_PRIMARY_PROJECT_HOST_ROOT:-/data/docker_data/termes/app}:/workspace/projects/termes-mvp
      - ${TERMES_ACCOUNT_RUNS_HOST_ROOT:?TERMES_ACCOUNT_RUNS_HOST_ROOT is required}:/data/docker_data/termes/runs
    tmpfs:
      - /opt/data/.codex:rw,noexec,nosuid,nodev,mode=0700,uid=10000,gid=10000
    cpus: ${HERMES_CELL_CPUS:-4}
    mem_limit: ${HERMES_CELL_MEMORY:-8g}
    pids_limit: ${HERMES_CELL_PIDS:-512}
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - termes_cell_default

  hermes-dashboard:
    build:
      context: ../..
      dockerfile: infra/hermes-agent/Dockerfile
    image: termes-hermes-dashboard:latest
    container_name: termes-hermes-dashboard
    restart: unless-stopped
    command: ["dashboard", "--no-open", "--host", "0.0.0.0", "--port", "9119", "--insecure"]
    profiles:
      - hermes-upstream
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HOME: /opt/data
      CODEX_HOME: /opt/data/.codex
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?HERMES_DASHBOARD_SESSION_TOKEN is required}
      TERMES_INTERNAL_DASHBOARD_TOKEN_AUTH: "true"
      TERMES_CODEX_AUTHORITY_URL: http://hermes-manager:8080/internal/openai-auth/external-tokens
      TERMES_CODEX_AUTHORITY_TOKEN: ${HERMES_CELL_AUTHORITY_TOKEN:?HERMES_CELL_AUTHORITY_TOKEN is required}
    volumes:
      - ${TERMES_ACCOUNT_HERMES_HOST_ROOT:?TERMES_ACCOUNT_HERMES_HOST_ROOT is required}:/opt/data
      - ${TERMES_ACCOUNT_WORKSPACE_HOST_ROOT:?TERMES_ACCOUNT_WORKSPACE_HOST_ROOT is required}:/workspace
      - ${TERMES_PRIMARY_PROJECT_HOST_ROOT:-/data/docker_data/termes/app}:/workspace/projects/termes-mvp
      - ${TERMES_ACCOUNT_RUNS_HOST_ROOT:?TERMES_ACCOUNT_RUNS_HOST_ROOT is required}:/data/docker_data/termes/runs
    tmpfs:
      - /opt/data/.codex:rw,noexec,nosuid,nodev,mode=0700,uid=10000,gid=10000
    cpus: ${HERMES_CELL_CPUS:-4}
    mem_limit: ${HERMES_CELL_MEMORY:-8g}
    pids_limit: ${HERMES_CELL_PIDS:-512}
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - termes_cell_default

  hermes-dashboard-account-b:
    build:
      context: ../..
      dockerfile: infra/hermes-agent/Dockerfile
    image: termes-hermes-dashboard:latest
    container_name: termes-hermes-dashboard-account-b
    restart: unless-stopped
    command: ["dashboard", "--no-open", "--host", "0.0.0.0", "--port", "9119", "--insecure"]
    profiles:
      - hermes-upstream
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HOME: /opt/data
      CODEX_HOME: /opt/data/.codex
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?HERMES_DASHBOARD_SESSION_TOKEN is required}
      TERMES_INTERNAL_DASHBOARD_TOKEN_AUTH: "true"
      TERMES_CODEX_AUTHORITY_URL: http://hermes-manager:8080/internal/openai-auth/external-tokens
      TERMES_CODEX_AUTHORITY_TOKEN: ${HERMES_CELL_AUTHORITY_TOKEN:?HERMES_CELL_AUTHORITY_TOKEN is required}
    volumes:
      - ${TERMES_SECOND_ACCOUNT_HERMES_HOST_ROOT:?TERMES_SECOND_ACCOUNT_HERMES_HOST_ROOT is required}:/opt/data
      - ${TERMES_SECOND_ACCOUNT_WORKSPACE_HOST_ROOT:?TERMES_SECOND_ACCOUNT_WORKSPACE_HOST_ROOT is required}:/workspace
      - ${TERMES_SECOND_ACCOUNT_RUNS_HOST_ROOT:?TERMES_SECOND_ACCOUNT_RUNS_HOST_ROOT is required}:/data/docker_data/termes/runs
    tmpfs:
      - /opt/data/.codex:rw,noexec,nosuid,nodev,mode=0700,uid=10000,gid=10000
    cpus: ${HERMES_CELL_CPUS:-4}
    mem_limit: ${HERMES_CELL_MEMORY:-8g}
    pids_limit: ${HERMES_CELL_PIDS:-512}
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - termes_cell_b

  runner-supervisor:
    build:
      context: ../..
      dockerfile: services/runner-supervisor/Dockerfile
    container_name: termes-runner-supervisor
    restart: unless-stopped
    environment:
      PORT: 8080
      WORKSPACE_ROOT: /data/docker_data/termes/workspaces
      RUNS_ROOT: /data/docker_data/termes/runs
    volumes:
      - ${TERMES_ACCOUNT_WORKSPACE_HOST_ROOT:?TERMES_ACCOUNT_WORKSPACE_HOST_ROOT is required}:/data/docker_data/termes/workspaces
      - ${TERMES_ACCOUNT_RUNS_HOST_ROOT:?TERMES_ACCOUNT_RUNS_HOST_ROOT is required}:/data/docker_data/termes/runs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: termes-web
    restart: unless-stopped
    ports:
      - "${TERMES_WEB_BIND}:${TERMES_WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - termes_internal
      - npm_proxy

  backup:
    image: alpine:3.22
    container_name: termes-backup
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /data/docker_data/termes/backups && sleep infinity"]
    volumes:
      - /data/docker_data/termes/backups:/data/docker_data/termes/backups
    networks:
      - termes_internal

  log-collector:
    image: alpine:3.22
    container_name: termes-log-collector
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /data/docker_data/termes/logs && sleep infinity"]
    volumes:
      - /data/docker_data/termes/logs:/data/docker_data/termes/logs
    networks:
      - termes_internal

networks:
  termes_internal:
    name: termes_internal
  npm_proxy:
    external: true
    name: ${TERMES_NPM_NETWORK}
  termes_cell_default:
    name: termes_cell_default
    internal: false
  termes_cell_b:
    name: termes_cell_b
    internal: false
