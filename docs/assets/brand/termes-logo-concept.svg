  <g fill="none" stroke="#79A7FF" stroke-linecap="round" stroke-width="52">
    <path d="M154 420C214 408 255 371 307 314"/>
    <path d="M128 512C208 505 258 477 304 430"/>
    <path d="M154 604C218 599 261 580 307 544"/>
  </g>

  <!-- Turtle: compact shell, neck and head kept inside the maskable safe area. -->
  <path d="M586 270C618 202 674 184 706 220C724 242 708 276 658 310Z" fill="#65C49D"/>
  <path d="M586 754C618 822 674 840 706 804C724 782 708 748 658 714Z" fill="#65C49D"/>
  <path d="M348 242H580C690 242 764 354 764 512S690 782 580 782H348C266 782 224 665 224 512S266 242 348 242Z" fill="#2563EB"/>
  <path d="M738 456H790V568H738Z" fill="#65C49D"/>
  <circle cx="824" cy="512" r="72" fill="#65C49D"/>
  <circle cx="850" cy="490" r="10" fill="#0D1016"/>

  <!-- T: the product initial and Turtle initial, cut as a bold UI-scale monogram. -->
