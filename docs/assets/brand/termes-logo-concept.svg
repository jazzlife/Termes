  <title id="title">Termes logo concept</title>
  <desc id="description">A white T set in a blue turtle shell, with a green turtle head and three wing-like motion strokes representing Hermes.</desc>

  <rect width="1024" height="1024" rx="224" fill="#0D1016"/>

