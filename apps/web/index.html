<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1016" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Termes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Termes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/termes-favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/termes-icon-launcher-v3-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/termes-apple-touch-icon-v3.png" />
    <title>Termes</title>
    <script>
      (() => {
        const stored = localStorage.getItem("termes-theme-v2") || localStorage.getItem("termes-theme") || "system";
        const resolved = stored === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : stored;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = stored;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body data-app-shell="termes">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
