name: Desktop connector test builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop-connector/**"
      - "apps/desktop-connector-qt/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-connector.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            artifact: termes-connector-macos-arm64
            paths: |
              apps/desktop-connector/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop-connector/src-tauri/target/release/bundle/macos/*.app
          - name: Windows x64
            os: windows-2022
            artifact: termes-connector-windows-x64
            paths: |
              apps/desktop-connector/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop-connector/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck connector UI
        run: pnpm --filter @termes/desktop-connector typecheck
      - name: Test connector native core
        run: cargo test --manifest-path apps/desktop-connector/src-tauri/Cargo.toml
      - name: Build signed macOS test bundle
        if: runner.os == 'macOS'
        run: pnpm --filter @termes/desktop-connector build:macos:test
      - name: Build Windows test bundle
        if: runner.os == 'Windows'
        run: pnpm --filter @termes/desktop-connector exec tauri build
      - name: Upload native test bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  build-qt-windows:
    name: Windows Qt x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: "true"
      - name: Configure Qt connector
        shell: pwsh
        run: cmake -S apps/desktop-connector-qt -B apps/desktop-connector-qt/build-ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
      - name: Build Qt connector
        run: cmake --build apps/desktop-connector-qt/build-ci --config Release --parallel
      - name: Test Qt connector
        run: ctest --test-dir apps/desktop-connector-qt/build-ci -C Release --output-on-failure
      - name: Package Qt connector
        run: cmake --install apps/desktop-connector-qt/build-ci --config Release --prefix apps/desktop-connector-qt/package
      - name: Upload Qt connector
        uses: actions/upload-artifact@v4
        with:
          name: termes-connector-qt-windows-x64
          path: apps/desktop-connector-qt/package
          if-no-files-found: error
          retention-days: 14
